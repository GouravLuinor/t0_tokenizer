name: Scheduled Model Catalog Sync

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (weekly)
    - cron: '0 0 * * 0'
  # Allows manual 1-click execution from GitHub Actions UI:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    name: Sync OpenRouter Models
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch & Curate OpenRouter Models
        run: npm run sync:models

      - name: Verify Types & Unit Tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Check for Catalog Changes & Commit
        run: |
          git config --global user.name "norai-bot"
          git config --global user.email "bot@norai.tech"

          # Check if modelCatalog.generated.ts was modified
          if ! git diff --quiet app/tools/tokencraft/_lib/modelCatalog.generated.ts; then
            echo "Changes detected in modelCatalog.generated.ts. Committing..."
            git add app/tools/tokencraft/_lib/modelCatalog.generated.ts
            git commit -m "chore(models): auto-sync OpenRouter model catalog [skip ci]"
            git push origin main
          else
            echo "No model changes detected. Catalog is up to date."
          fi
